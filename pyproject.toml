[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-qa-research"
version = "0.1.0"
description = "Reproducible multilingual Qwen QA adaptation and grounded campus research"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "PyYAML==6.0.2", "httpx==0.28.1", "psutil==7.0.0",
  "huggingface-hub==0.36.0", "ijson==3.4.0"
]

[project.optional-dependencies]
ml = [
  "torch==2.7.1", "transformers==4.57.3", "peft==0.18.0",
  "accelerate==1.12.0", "bitsandbytes==0.48.2",
  "sentence-transformers==5.1.2", "chromadb==1.3.5"
]
test = ["pytest==8.3.5"]

[project.scripts]
campusqa = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
